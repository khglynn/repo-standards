  # ---------------------------------------------------------------------------------
  # Python via requirements.txt (the "pip" ecosystem).
  # ---------------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "{{DIRECTORY}}"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # See npm.yml for the reasoning behind the cooldown numbers — same soak, same why.
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
