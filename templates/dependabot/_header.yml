# Dependabot — the bot that opens pull requests to keep this repo's dependencies current.
# Stamped from https://github.com/khglynn/repo-standards (templates/dependabot/) — if you
# want to change the policy for ALL repos, change it there and re-stamp, don't edit here.
#
# THE TWO HALVES, because they are easy to confuse:
#   1. SECURITY updates  — fire when a CVE is published against something you depend on.
#      They need NO file: they are switched on account-wide for every repo Kevin owns.
#      They are also EXEMPT from the cooldown below, deliberately: a known-exploited
#      vulnerability beats the risk of an unsoaked release.
#   2. VERSION updates   — "keep current" for its own sake. That is what THIS file turns on.
#
# What happens to the PRs this file opens is decided by one shared workflow:
# .github/workflows/dependabot-automerge.yml (a ten-line pointer at repo-standards).
# Short version: patch and minor merge themselves once CI is green; majors get a label
# and wait for a person.
version: 2
updates:
