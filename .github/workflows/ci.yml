# CI for the standards repo itself.
#
# WHY THIS MATTERS MORE THAN NORMAL CI: the workflow in this repo runs, with write
# permission, inside every repo that points at it. A typo here is a typo everywhere at
# once, and it would surface as "Dependabot PRs quietly stopped merging" — the kind of
# silence nobody notices for a month. So the shared workflow gets linted before it ships.
#
# This job is also this repo's own required status check, which is what lets the standards
# repo be enrolled in its own standard instead of being the one repo exempt from it.
# Written 2026-09-11.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Both actions are pinned to a commit SHA, for the same reason the shared workflow
      # pins fetch-metadata: a tag can be moved to new code by whoever controls the repo,
      # and this job is the ONLY gate in front of a workflow that runs with write
      # permission inside every enrolled repo. Pinning two of three would have made the
      # README's own argument half true. SHAs resolved 2026-09-11 from their tags
      # (both lightweight, so the ref points straight at a commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint parses every workflow AND runs shellcheck over each `run:` block, which
      # is where the real bugs live — an unquoted variable, a typo'd jq filter.
      - name: Lint the workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # The stub and the dependabot fragments are templates, so nothing above reads them.
      - name: Check the templates still compose
        run: |
          python3 -m pip install --quiet pyyaml
          python3 bin/lib/check-templates.py

      - name: Check the scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck bin/enroll bin/audit bin/classify-pr bin/lib/check-classifier.sh \
                     bin/lib/check-workflow-hygiene.sh
          python3 -m py_compile bin/lib/*.py

      # The one rule that exists in two places and cannot be deduplicated: the shared
      # workflow never checks out code, so its classification jq has to be inline, and
      # bin/classify-pr carries a second copy. This proves the copies still agree, and
      # that the trailer parser reproduces fetch-metadata v3's COMPUTED update-type —
      # the gap a 2026-09-11 review found, where the tool said "cannot classify" about a
      # PR the workflow would have labelled major (and, worse, about patch bumps it
      # would have merged).
      - name: The classifier says the same thing in both places
        run: bin/lib/check-classifier.sh

      # The two workflow-hygiene warnings `bin/audit` reports about OTHER people's repos:
      # a job with no time limit (a hang inherits GitHub's 6-hour default and eats an
      # eighth of the monthly private allowance) and the push+pull_request double run.
      # These answers reach Kevin in a weekly Slack digest, where a parser that silently
      # stops finding things looks exactly like a good week. Fixtures tell them apart.
      - name: The workflow-hygiene warnings still fire (and still stay silent)
        run: bin/lib/check-workflow-hygiene.sh

      # A fixture run of the ecosystem detector: proves it still says what we think it says,
      # independently of any live repo. If this ever disagrees, enroll is about to write the
      # wrong dependabot.yml into somebody's repo.
      - name: Self-test the ecosystem detector
        run: |
          got=$(printf '%s\n' \
            package.json \
            app/pyproject.toml \
            app/requirements.txt \
            node_modules/left-pad/package.json \
            deep/nested/dir/package.json \
            .github/workflows/ci.yml \
            | python3 bin/lib/detect-ecosystems.py)
          want=$(printf 'github-actions\t/\nnpm\t/\nuv\t/app')
          if [ "$got" != "$want" ]; then
            echo "detector changed behaviour."; echo "got:"; echo "$got"; echo "want:"; echo "$want"; exit 1
          fi
          echo "detector: ok (ignored node_modules, ignored the deep path, preferred uv over pip)"
