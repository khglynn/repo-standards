# Dependabot auto-merge — the ONE copy of the merge rules for all of Kevin's repos.
# Written 2026-09-11. Called by a ~10-line stub in each repo (templates/caller-stub.yml).
#
# WHAT IT DOES, in one sentence: when Dependabot opens a pull request that is ONLY
# patch and/or minor bumps, and the repo actually has a CI check that can fail, this
# approves the PR and asks GitHub to merge it as soon as that check goes green.
# Everything else — a major bump, an update it cannot classify, a repo with no CI —
# gets a label and waits for a human.
#
# WHY A REUSABLE WORKFLOW: personal GitHub accounts have no org-level rulesets and no
# "required workflows", so there is no way to force a workflow onto every repo. A
# reusable workflow is the next best thing: the LOGIC lives here once, each repo keeps
# only a stub that points at it, and fixing a bug here fixes every repo at once.
# This repo is public on purpose — a PRIVATE reusable workflow can only be called by
# the owner's private repos, a public one can be called by all of them.
#
# SECURITY — why `pull_request_target` in the caller stub is safe here:
# that trigger runs with WRITE permissions in the base repo's context, which would be
# dangerous if it ever executed code from the pull request. THIS WORKFLOW NEVER CHECKS
# OUT ANY CODE. It only reads pull-request metadata and calls the GitHub API.
# Do not add `actions/checkout` to this file. Ever.
#
# THE ONE THING THAT MAKES THIS SAFE AT ALL: `gh pr merge --auto` merges IMMEDIATELY
# when the branch has no required status check (cli/cli#13880, still open 2026-09-11) —
# it is "auto-merge" in name only at that point. So this workflow REFUSES to enable
# auto-merge on a branch with no required check, and labels the PR instead. A repo with
# no CI gets visibility, never a blind merge.
#
# THE OTHER RULE THIS FILE OBEYS (learned the hard way, 2026-09-11): never push to a
# pull-request branch from here. A push made with GITHUB_TOKEN does not start a new
# workflow run, so "refresh the branch and let CI re-run" is a dead end that strands
# the PR behind a check that will never report again. Anything that needs CI to re-run
# has to come from Dependabot's own push. See step 6.
#
# AND THE GAP THAT RULE LEFT (step 7, added 2026-09-22, OFF BY DEFAULT): this workflow
# runs when the PR opens, seconds before its tests finish. When a patch/minor update then
# went RED, nothing ever ran again: auto-merge stayed queued forever, no label was applied,
# so no verdict reached Slack — one grouped update sat that way for six days, invisible.
# Step 7 can wait (a bounded number of minutes) for the required checks and label a failure
# `dependabot-ci-failed`, which the verdict routines pick up like the other labels. It has
# to happen inside THIS run: GitHub never starts a workflow for a check that GitHub Actions
# itself reported (the `check_run`/`check_suite` recursion rule), so there is no later
# event to hang it on. It ships switched off — `watch-minutes: 0` — because waiting costs
# private runner minutes and the account was already past its allowance that month, and
# because the weekly audit's open loops list red queued updates anyway. A repo opts in
# from its stub; see the `watch-minutes` input below for the three steps.
#
# AND ONE MORE QUESTION BEFORE ANYTHING MERGES (step 4b, added 2026-11-12, ON BY DEFAULT):
# does this update bring in a version that Google's OSV database already knows is
# vulnerable, or malicious? OSV carries the OpenSSF malicious-package reports (the `MAL-`
# ids), which is the shape of the 2025-26 npm attacks: a hijacked release that the 7-day
# cooldown should outwait, but that a security update (no cooldown) can still propose.
# OSV-Scanner reads the lockfiles this PR changed, at the PR's head and at its merge base,
# and only advisories the PR ADDS stop it: every one of Kevin's repos already carries some
# unfixed advisories, and refusing on those would refuse every update. A `MAL-` finding
# stops it even when it was already there. A real finding gets `dependabot-osv-flagged`
# and a comment naming each advisory; a scan that could not run gets
# `dependabot-needs-human`. Neither merges.

name: dependabot-automerge (reusable)

on:
  workflow_call:
    inputs:
      merge-patch:
        description: "Auto-merge patch bumps (x.y.Z). Turn off to review every update by hand."
        type: boolean
        default: true
      merge-minor:
        description: "Auto-merge minor bumps (x.Y.z). Turn off in a repo where minors have bitten you."
        type: boolean
        default: true
      merge-method:
        description: "squash | merge | rebase — how the PR lands on the default branch."
        type: string
        default: squash
      require-ci:
        description: >-
          Refuse to auto-merge when the base branch has no required status check.
          Leave this true. Setting it false means "merge dependency PRs with no tests
          at all", which is the one thing GitHub's own auto-merge does by accident.
        type: boolean
        default: true
      stale-strategy:
        description: >-
          What to do when a PR has fallen behind the base branch AND a required check is red:
          "none" (default — log it and leave the PR queued) or "comment" (post
          `@dependabot recreate` and let Dependabot rebuild the branch, whose OWN push does
          re-run CI). UNVERIFIED as of 2026-09-11 whether Dependabot obeys a command posted
          by github-actions[bot] — see the README decisions section.
          A third option, "update-branch", was REMOVED 2026-09-11: see step 6's comment.
        type: string
        default: none
      label-major:
        description: "Label put on a PR that contains a major version bump."
        type: string
        default: major-review-needed
      label-unparsed:
        description: "Label put on a PR this workflow could not classify, or when the run itself broke."
        type: string
        default: dependabot-needs-human
      label-no-ci:
        description: "Label put on a PR whose base branch has no required status check."
        type: string
        default: no-ci-gate
      label-opted-out:
        description: >-
          Label put on a PR that classified perfectly but sits in a tier THIS repo turned off
          (merge-patch: false / merge-minor: false). Deliberately not the same label as
          "could not classify" — that one sends you to the checks tab for a broken run, and
          there is no broken run here.
        type: string
        default: dependabot-opted-out
      label-ci-failed:
        description: >-
          Label put on a PR this workflow queued to merge whose required check then FAILED.
          Its own label, not dependabot-needs-human: that one means this workflow could not
          classify the PR or broke; this one means the update itself broke the tests.
        type: string
        default: dependabot-ci-failed
      watch-minutes:
        description: >-
          OFF BY DEFAULT (0). After queueing auto-merge, how long to wait for the required
          checks so a failure can be labelled `label-ci-failed` (15 at most). Waiting costs
          runner minutes on a private repo: about two extra per update PR at the check
          times measured 2026-09-22. To turn it on in one repo: add `checks: read` and
          `statuses: read` to that repo's stub permissions, set this in its `with:` block
          (10 is plenty), and add dependabot-ci-failed to its verdict routine's label filter.
        type: number
        default: 0
      osv-scan:
        description: >-
          ON BY DEFAULT. Before queueing the merge, scan the lockfiles this PR changed with
          OSV-Scanner and stop if the PR adds a known vulnerability, or contains a known
          malicious package (an OSV `MAL-` id). Turn off only in a repo where the scan
          cannot work, and say why on the line.
        type: boolean
        default: true
      label-osv:
        description: >-
          Label put on a PR whose new versions OSV already has an advisory for. Its own
          label, not dependabot-needs-human: that one means the run broke or could not
          read something; this one means the scan worked and found something.
        type: string
        default: dependabot-osv-flagged

# NO `permissions:` BLOCK HERE, ON PURPOSE (2026-09-22). A called workflow may only narrow
# what its caller granted — and asking for one scope the caller did NOT grant is not a
# narrowing, it is a startup failure ("the nested job is requesting 'checks: read', but is
# only allowed 'checks: none'"). Step 7 reads check results, which needs `checks: read` and
# `statuses: read`, and the stubs already in enrolled repos grant neither. Declaring them
# here would have broken every one of those repos at once. So the caller decides, and this
# job runs with exactly what the stub grants:
#   contents: write, pull-requests: write, issues: write   — every stub (approve, merge, label)
#   checks: read, statuses: read                           — only a stub that turns step 7 on
# With the watch on and those two missing, step 7 cannot read the checks on a private repo;
# it says so in the log and changes nothing. With the watch off (the default) this job
# runs with the same three scopes, and does the same things, as before 2026-09-22.

jobs:
  automerge:
    # Belt and suspenders. The caller's trigger fires for every PR in the repo; this job
    # only ever acts on pull requests Dependabot itself opened.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # A hang with no ceiling inherits GitHub's six-hour default — an eighth of the monthly
    # private allowance for one stuck run, in every enrolled repo at once. This job makes
    # a handful of API calls and never waits on anything; ten minutes is generous. Found by
    # this repo's own bin/audit the day the timeout check shipped (2026-09-14).
    # Since 2026-09-22 the ceiling follows step 7: still 10 for every repo that has not
    # turned the watch on (the default), 25 for one that has (`watch-minutes` is 15 at
    # most). Expressions have no arithmetic, hence the `&& ||` choice between the two.
    timeout-minutes: ${{ inputs.watch-minutes > 0 && 25 || 10 }}
    # One run per pull request. A Dependabot PR can fire `synchronize` several times in a
    # row (each rebase is a new push); queuing them serially avoids two runs racing to
    # enable auto-merge on the same PR. NOTE: GitHub keeps at most ONE pending run per
    # group — a third event replaces the queued second one rather than stacking behind it.
    concurrency:
      group: dependabot-automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      # Never interpolate ${{ github.event.* }} straight into a `run:` block — a crafted
      # branch or title would become shell. Everything arrives as an environment variable.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      IN_MERGE_PATCH: ${{ inputs.merge-patch }}
      IN_MERGE_MINOR: ${{ inputs.merge-minor }}
      IN_MERGE_METHOD: ${{ inputs.merge-method }}
      IN_REQUIRE_CI: ${{ inputs.require-ci }}
      IN_STALE_STRATEGY: ${{ inputs.stale-strategy }}
      LABEL_MAJOR: ${{ inputs.label-major }}
      LABEL_UNPARSED: ${{ inputs.label-unparsed }}
      LABEL_NO_CI: ${{ inputs.label-no-ci }}
      LABEL_OPTED_OUT: ${{ inputs.label-opted-out }}
      LABEL_CI_FAILED: ${{ inputs.label-ci-failed }}
      IN_WATCH_MINUTES: ${{ inputs.watch-minutes }}
      IN_OSV_SCAN: ${{ inputs.osv-scan }}
      LABEL_OSV: ${{ inputs.label-osv }}

    steps:
      # ---------------------------------------------------------------------------------
      # 1. Make sure the labels we may need actually exist.
      #
      # This runs FIRST, before anything that might want to apply one. `gh label create
      # --force` is create-or-update, so this is safe to run on every single PR forever.
      # It also creates `dependencies`, which every dependabot.yml stamped from this repo
      # asks for — a missing label makes Dependabot post a complaint on every PR it opens.
      # ---------------------------------------------------------------------------------
      # Every input is checked HERE, before a single label, approval or comment. A bad
      # value used to surface three steps later — after auto-merge had been enabled —
      # which meant the failure handler labelled the PR dependabot-needs-human about a
      # PR that was already queued to merge. Fail before doing anything instead.
      - name: Check the inputs make sense
        run: |
          set -euo pipefail
          # Fail CLOSED on a malformed switch. `require-ci` is the single protection the
          # whole design rests on, so anything that is not literally true/false is a bug we
          # want to see, never a silent "merge with no tests".
          case "$IN_REQUIRE_CI" in
            true|false) : ;;
            *) echo "::error title=Bad require-ci::'$IN_REQUIRE_CI' is not true or false"; exit 1 ;;
          esac
          case "$IN_MERGE_PATCH" in true|false) : ;; *) echo "::error title=Bad merge-patch::'$IN_MERGE_PATCH' is not true or false"; exit 1 ;; esac
          case "$IN_MERGE_MINOR" in true|false) : ;; *) echo "::error title=Bad merge-minor::'$IN_MERGE_MINOR' is not true or false"; exit 1 ;; esac
          case "$IN_OSV_SCAN" in true|false) : ;; *) echo "::error title=Bad osv-scan::'$IN_OSV_SCAN' is not true or false"; exit 1 ;; esac
          case "$IN_MERGE_METHOD" in
            squash|merge|rebase) : ;;
            *) echo "::error title=Bad merge-method::'$IN_MERGE_METHOD' is not squash, merge or rebase"; exit 1 ;;
          esac
          case "$IN_STALE_STRATEGY" in
            none|comment) : ;;
            *) echo "::error title=Bad stale-strategy::'$IN_STALE_STRATEGY' is not none or comment"; exit 1 ;;
          esac
          # A whole number from 0 to 15. The job's own timeout is 25, and a watch that could
          # outlast it would be killed mid-wait and read as a broken run.
          case "$IN_WATCH_MINUTES" in
            ''|*[!0-9]*) echo "::error title=Bad watch-minutes::'$IN_WATCH_MINUTES' is not a whole number of minutes"; exit 1 ;;
          esac
          if [ "$IN_WATCH_MINUTES" -gt 15 ]; then
            echo "::error title=Bad watch-minutes::'$IN_WATCH_MINUTES' is more than 15"; exit 1
          fi
          echo "inputs ok: patch=$IN_MERGE_PATCH minor=$IN_MERGE_MINOR method=$IN_MERGE_METHOD require-ci=$IN_REQUIRE_CI stale=$IN_STALE_STRATEGY watch=${IN_WATCH_MINUTES}m osv=$IN_OSV_SCAN"

      # ---------------------------------------------------------------------------------
      # 1b. A NEW HEAD STARTS UNQUEUED (added 2026-11-12, after a review found the hole).
      #
      # A Dependabot rebase keeps the auto-merge an earlier head queued: GitHub turns
      # auto-merge off on a push only by someone without write access, and Dependabot has
      # it. So until this run decides, the new head is queued to merge on CI alone,
      # classified by nobody and scanned by nobody, and a CI faster than this run would
      # land it. This step takes the queue off first, before anything slow; step 5 puts it
      # back only once this head has passed every check below, OSV's included.
      #
      # What's left is a window of seconds: from Dependabot's push to this step, a job start
      # and one API call. The new head's required CI has to start and finish inside it.
      # Closing that too takes a required check this workflow reports itself, which every
      # enrolled repo's ruleset and stub would need (repo-standards README, 2026-11-12).
      #
      # A read or a removal that fails turns the run red (the last step labels it), since
      # an earlier queue left standing is exactly the case this is for.
      # ---------------------------------------------------------------------------------
      - name: Take an earlier head's queued auto-merge off before deciding anything
        if: github.event.action != 'opened'
        run: |
          set -uo pipefail
          on=$(timeout 60 gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null' 2>/dev/null)
          case "$on" in
            true)
              if timeout 60 gh pr merge --disable-auto "$PR_URL"; then
                echo "auto-merge taken off: an earlier head queued it, and this head ($HEAD_SHA) is not decided yet"
              else
                echo "::error title=Could not take off auto-merge::an earlier head's queued merge is still on, and this head is unchecked"; exit 1
              fi
              ;;
            false) echo "no auto-merge queued on this PR" ;;
            *) echo "::error title=Could not read auto-merge::cannot tell whether an earlier head's merge is queued"; exit 1 ;;
          esac

      - name: Make sure the labels exist (idempotent)
        run: |
          set -euo pipefail
          create() { gh label create "$1" --force --color "$2" --description "$3" --repo "$REPO" >/dev/null; }
          create "dependencies"     "0366d6" "Dependency updates (Dependabot)"
          create "$LABEL_MAJOR"     "d93f0b" "Major version bump — a human must review before merge"
          create "$LABEL_UNPARSED"  "b60205" "Auto-merge could not classify this update (or the run broke)"
          create "$LABEL_NO_CI"     "fbca04" "No required status check on the base branch, so nothing was auto-merged"
          create "$LABEL_OPTED_OUT" "c5def5" "Classified fine, but this repo opted out of auto-merging that tier"
          ensured="dependencies, $LABEL_MAJOR, $LABEL_UNPARSED, $LABEL_NO_CI, $LABEL_OPTED_OUT"
          # Only where the watch is on: with it off (the default) this step creates exactly
          # the labels it created before 2026-09-22, so a repo sees no new label it cannot get.
          if [ "$IN_WATCH_MINUTES" -gt 0 ]; then
            create "$LABEL_CI_FAILED" "e99695" "Queued to merge, but a required check failed — it will not merge until fixed"
            ensured="$ensured, $LABEL_CI_FAILED"
          fi
          # Same rule for the OSV scan (2026-11-12): only where it can apply the label.
          if [ "$IN_OSV_SCAN" = "true" ]; then
            create "$LABEL_OSV" "d73a4a" "OSV knows a vulnerability or malicious-package report for a version this update adds"
            ensured="$ensured, $LABEL_OSV"
          fi
          echo "labels: ensured $ensured"

      # ---------------------------------------------------------------------------------
      # 2. Read what Dependabot is actually proposing.
      #
      # Pinned to a commit SHA rather than a moving tag: a tag can be re-pointed at new
      # code by whoever controls the action, and this workflow runs with write permissions.
      # SHA resolved 2026-09-11 from refs/tags/v3.1.0 (a lightweight tag → commit directly).
      # ---------------------------------------------------------------------------------
      - name: Read the update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------------------
      # 3. Classify the PR from the PER-DEPENDENCY list, never the aggregate.
      #
      # ⚠ THE TRAP THIS AVOIDS: fetch-metadata also publishes a single `update-type`
      # output. That output is the MAXIMUM level across all dependencies AND IT IGNORES
      # NULLS. A grouped PR holding one patch bump plus one dependency it could not
      # classify reports `semver-patch` — so a gate written against the aggregate happily
      # merges an unknown change. We therefore read `updated-dependencies-json` and demand
      # that EVERY entry is individually an allowed level.
      #
      # Verdicts: merge | major | unknown | disallowed
      # ---------------------------------------------------------------------------------
      - name: Decide whether this PR is allowed to merge itself
        id: classify
        env:
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail

          # Written as plain `if`s rather than `[ … ] && x=y`: under `set -e` an AND-list whose
          # left side is false is only survivable because of a POSIX exemption, and the day
          # someone moves one of these lines to the end of the script it exits 1 for no reason.
          allowed='[]'
          if [ "$IN_MERGE_PATCH" = "true" ]; then
            allowed=$(jq -cn --argjson a "$allowed" '$a + ["version-update:semver-patch"]')
          fi
          if [ "$IN_MERGE_MINOR" = "true" ]; then
            allowed=$(jq -cn --argjson a "$allowed" '$a + ["version-update:semver-minor"]')
          fi
          echo "allowed update levels: $allowed"

          # An empty or unparseable payload is itself a reason to stop.
          if [ -z "${DEPS_JSON:-}" ] || ! printf '%s' "$DEPS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
            { echo "verdict=unknown"; echo "summary="; } >> "$GITHUB_OUTPUT"
            echo "::warning title=Unclassifiable Dependabot PR::No per-dependency metadata; leaving for a human."
            exit 0
          fi

          summary=$(printf '%s' "$DEPS_JSON" | jq -r '[.[] | "\(.dependencyName) \(.prevVersion // "?")->\(.newVersion // "?") [\(.updateType // "UNKNOWN")]"] | join(", ")')
          echo "dependencies in this PR: $summary"

          known='["version-update:semver-patch","version-update:semver-major","version-update:semver-minor"]'
          verdict=$(printf '%s' "$DEPS_JSON" | jq -r \
            --argjson allowed "$allowed" --argjson known "$known" '
              [.[] | .updateType] as $t
              | if   ($t | any(. == "version-update:semver-major"))          then "major"
                elif ($t | any(. == null or . == "" or (IN($known[]) | not))) then "unknown"
                elif ($t | all(IN($allowed[])))                              then "merge"
                else "disallowed" end')

          {
            echo "verdict=$verdict"
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "decision: verdict=$verdict"

      - name: Stop — this PR needs a person
        if: steps.classify.outputs.verdict != 'merge'
        env:
          VERDICT: ${{ steps.classify.outputs.verdict }}
          SUMMARY: ${{ steps.classify.outputs.summary }}
        run: |
          set -euo pipefail
          case "$VERDICT" in
            major)      label="$LABEL_MAJOR"    ; why="contains a MAJOR version bump — the authors deliberately broke something." ;;
            unknown)    label="$LABEL_UNPARSED" ; why="contains an update this workflow could not classify (a null or unrecognised update type)." ;;
            # "disallowed" = every level was recognised, but this repo has merge-patch or
            # merge-minor switched off for that tier. Not a bug; a deliberate exception —
            # which is why it gets its OWN label (added 2026-09-11). Filing it under
            # "could not classify" sent you to a checks tab to hunt a broken run that
            # never existed.
            disallowed) label="$LABEL_OPTED_OUT" ; why="contains an update tier this repo has opted out of auto-merging (see the caller stub's inputs)." ;;
            *)          label="$LABEL_UNPARSED" ; why="produced an unexpected verdict: $VERDICT" ;;
          esac
          gh pr edit "$PR_URL" --add-label "$label"
          echo "labelled '$label' and stopped: this PR $why"
          echo "dependencies: ${SUMMARY:-none}"

      # ---------------------------------------------------------------------------------
      # 4. Does this branch actually have a CI gate?
      #
      # `gh pr merge --auto` on a branch with NO required status check does not queue
      # anything — it merges on the spot. So before we ever type `--auto` we ask the repo
      # what it requires. Rulesets first (the modern mechanism, and the only one that works
      # on a personal Pro account's private repos), classic branch protection as a fallback.
      # If BOTH lookups fail we treat it as "no checks" — the safe direction.
      #
      # ⚠ THE CLASSIC-PROTECTION BLIND SPOT (2026-09-11): reading classic branch protection
      # (`/branches/{b}/protection`) needs ADMIN rights, and GITHUB_TOKEN is not an admin.
      # On a repo protected the classic way that call returns **403, not 404** — so
      # swallowing every error and printing "no classic branch protection" states something
      # false about the repo, and then labels it `no-ci-gate` with advice ("add a CI
      # workflow") that is wrong for a repo which already has both. We therefore separate
      # the two: 404 means genuinely absent; 403 means WE CANNOT SEE, which is an unknown,
      # not a "no", and gets `label-unparsed` so the failure is diagnosable.
      # Long term the answer is rulesets everywhere — `enroll` only ever creates those, and
      # the ruleset endpoint is readable by a non-admin token.
      # ---------------------------------------------------------------------------------
      - name: Look up the required status checks on the base branch
        id: gate
        if: steps.classify.outputs.verdict == 'merge'
        run: |
          set -euo pipefail
          # Branch names with a slash have to be escaped for this path segment.
          base_esc=${BASE_BRANCH//\//%2F}
          checks=""
          # The same list as a JSON array, for the steps that need the NAMES exactly: a
          # required check can contain a comma — a matrix leg is named "test (ubuntu, 3.11)"
          # by default — and splitting the joined string on "," turns it into two names that
          # never match anything (found by review, 2026-09-22). `checks` stays the joined
          # form for the log lines and for `ok` below.
          checks_json='[]'
          unreadable=false

          # --paginate --slurp: the endpoint returns 30 rules a page, and a required check
          # on page two would read as "no gate" (fail-closed, but wrong). Same fix as
          # bin/enroll and bin/audit got on 2026-09-14; .[][] flattens the pages.
          if rules=$(gh api --paginate --slurp "repos/$REPO/rules/branches/$base_esc?per_page=100" 2>/dev/null); then
            checks_json=$(printf '%s' "$rules" | jq -c '
              [.[][] | select(.type == "required_status_checks")
                     | .parameters.required_status_checks[]?.context] | unique')
            checks=$(jq -r 'join(",")' <<< "$checks_json")
          else
            echo "note: could not read rulesets for $BASE_BRANCH (permissions or none configured)"
          fi

          if [ -z "$checks" ]; then
            # `-i` keeps the status line, so a 403 (not an admin) is distinguishable from a
            # 404 (no classic protection). Without this every failure looked like "none".
            prot=$(gh api -i "repos/$REPO/branches/$base_esc/protection" 2>/dev/null || true)
            status=$(printf '%s' "$prot" | head -1 | awk '{print $2}')
            case "$status" in
              200)
                checks_json=$(printf '%s' "$prot" | sed -n '/^{/,$p' | jq -c '
                  (((.required_status_checks.checks // []) | map(.context))
                   + (.required_status_checks.contexts // [])) | unique')
                checks=$(jq -r 'join(",")' <<< "$checks_json")
                ;;
              403)
                unreadable=true
                echo "note: classic branch protection on $BASE_BRANCH is UNREADABLE (403 — this token is not a repo admin). Not claiming there is none."
                ;;
              *)
                echo "note: no classic branch protection on $BASE_BRANCH either (status ${status:-no response})"
                ;;
            esac
          fi

          {
            echo "required-checks=$checks"
            echo "required-checks-json=$checks_json"
            echo "unreadable=$unreadable"
          } >> "$GITHUB_OUTPUT"

          # `ok` is the single condition every later step keys off, so the "did we clear the
          # CI gate?" question is answered in exactly one place instead of re-derived three times.
          if [ -n "$checks" ] || [ "$IN_REQUIRE_CI" = "false" ]; then ok=true; else ok=false; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ -n "$checks" ]; then
            echo "gate: $BASE_BRANCH requires [$checks]"
          elif [ "$unreadable" = "true" ]; then
            echo "gate: UNKNOWN — cannot read $BASE_BRANCH's classic protection from this token"
          else
            echo "gate: NONE — $BASE_BRANCH has no required status check"
          fi

      # The "we cannot see" case is not the "there is nothing" case, so it gets its own
      # label and no misleading advice. It stops before the no-CI comment below.
      - name: Stop — cannot tell whether this branch has a gate
        if: steps.gate.outputs.ok == 'false' && steps.gate.outputs.unreadable == 'true'
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label "$LABEL_UNPARSED"
          echo "::warning title=Branch protection unreadable::GITHUB_TOKEN is not a repo admin, so classic branch protection on $BASE_BRANCH could not be read. Migrate this repo to a ruleset (bin/enroll --ci-check) — those are readable without admin."
          echo "stopped WITHOUT enabling auto-merge: the gate on $BASE_BRANCH is unknown, not absent"

      - name: Stop — no CI gate on this branch
        if: steps.gate.outputs.ok == 'false' && steps.gate.outputs.unreadable != 'true'
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label "$LABEL_NO_CI"

          # One comment, ever. Re-commenting on every `synchronize` event would bury the PR
          # under identical notes; the HTML marker is how we recognise our own past comment.
          marker="<!-- repo-standards:no-ci-gate -->"
          if gh pr view "$PR_URL" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            echo "explanatory comment already present — not repeating it"
          else
            # Built line by line into a file: a heredoc cannot be used inside a YAML
            # literal block, because its body would have to sit at column 0 and that ends
            # the block. Backticks are escaped so the shell does not run them.
            {
              echo "$marker"
              echo "**Not auto-merging this one.** The \`$BASE_BRANCH\` branch has no required status check, and GitHub's auto-merge on a branch with no required check merges *immediately* instead of waiting for anything ([cli/cli#13880](https://github.com/cli/cli/issues/13880)). Auto-merging here would mean shipping a dependency change with nothing testing it."
              echo ""
              echo "**To turn auto-merge on for this repo:** add a CI workflow, then run \`bin/enroll $REPO --ci-check <job name>\` from [khglynn/repo-standards](https://github.com/khglynn/repo-standards)."
              echo ""
              echo "**To merge this PR:** review and merge it by hand, as normal."
            } > "$RUNNER_TEMP/no-ci-comment.md"
            gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/no-ci-comment.md"
            echo "left the one-time explanation comment"
          fi
          echo "stopped WITHOUT enabling auto-merge: no required check on $BASE_BRANCH"

      # ---------------------------------------------------------------------------------
      # 4b. Does this update bring in a version OSV already has an advisory for?
      #     (added 2026-11-12, on by default; `osv-scan: false` in a stub turns it off)
      #
      # The 7-day cooldown outwaits a hijacked release that gets pulled within hours, but
      # security updates skip the cooldown, and a bad release can outlive a week. OSV
      # (osv.dev) is Google's open vulnerability database, and it carries the OpenSSF
      # malicious-package reports as `MAL-` ids. This asks it about the exact versions the
      # PR's lockfiles would install, including the transitive ones nobody named.
      #
      # STILL NO CHECKOUT. The lockfiles are fetched through the contents API as plain data
      # into RUNNER_TEMP, and the scanner only parses them: call analysis (which for Rust
      # runs build scripts) and manifest resolution are both switched off. The scanner is
      # a release binary pinned by version and checksum, and it runs with an empty
      # environment, so this job's write token is not in its environment.
      #
      # WHAT COUNTS: an advisory at the PR's head that the same file did not already carry
      # at the merge base, keyed on file, ecosystem, package and advisory id (not version,
      # so a bump that leaves an old advisory standing has not added it). A `MAL-` id counts
      # even when it was there before. Every one of Kevin's repos carried some unfixed
      # advisory on 2026-11-12 (4 to 38 per lockfile), so "any advisory" would refuse every
      # update in every repo.
      #
      # FAIL CLOSED, BUT SAY WHICH WAY. A finding → `label-osv` and a comment. A scan that
      # could not happen (the download, a parse error, OSV unreachable, a lockfile that
      # yielded no packages) → `label-unparsed`. Neither merges, and neither turns the run
      # red: they are verdicts, not breakages.
      #
      # WHAT IT DOES NOT SEE: a PR that changes no lockfile, like a GitHub Actions bump or
      # a manifest-only repo, has nothing to scan and goes on as before (the log says so).
      # And it asks once, when the run fires: an advisory published after the PR was
      # queued is not seen unless Dependabot pushes again.
      # ---------------------------------------------------------------------------------
      - name: Check the new versions against OSV (vulnerabilities and malicious packages)
        id: osv
        if: steps.gate.outputs.ok == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Pinned by version AND checksum, the way fetch-metadata is pinned by SHA. v2.7.0
          # (published 2026-10-12), not v2.7.1 (2026-11-09): the same 7-day soak the updates
          # themselves get. The checksum is the osv-scanner_linux_amd64 line of the release's
          # own osv-scanner_SHA256SUMS; `bin/lib/check-osv.sh --live` re-downloads and
          # checks it in CI, so a typo here fails this repo's CI, not every enrolled repo.
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          set -uo pipefail
          # Every way out writes `verdict` (off | nothing | clean | flagged | unread) and
          # `clear` (true only for the first three). It never exits non-zero on purpose.
          out() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          unread() {
            out "verdict=unread" "clear=false"
            echo "::warning title=OSV check could not run::$1. Labelled for a person rather than merged unscanned; re-running this workflow tries again."
            exit 0
          }

          if [ "$IN_OSV_SCAN" != "true" ]; then
            out "verdict=off" "clear=true"
            echo "osv: switched off in this repo's stub (osv-scan: false), so not scanned"
            exit 0
          fi
          work="$RUNNER_TEMP/osv"
          mkdir -p "$work/head" "$work/base" "$work/bin" || unread "could not make a work folder"

          # 1. Which lockfiles did the PR change? By file name; a manifest alone
          #    (package.json, pyproject.toml) names ranges, not what will install.
          #    bin/lib/check-osv.sh runs this rule against fixtures.
          OSV_FILES_JQ='
            def scannable: split("/") | last
              | IN("package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock",
                   "bun.lock", "uv.lock", "poetry.lock", "Pipfile.lock", "pdm.lock",
                   "Cargo.lock", "go.mod", "Gemfile.lock", "composer.lock", "pubspec.lock",
                   "mix.lock", "gradle.lockfile")
                or test("requirements[^/]*[.]txt$");
            def in_requirements_dir: split("/") | (length > 1 and .[-2] == "requirements" and (last | endswith(".txt")));
            def safe: (startswith("/") or (split("/") | any(. == ".." or . == "." or . == ""))) | not;
            [ .[][]
              | select(.status != "removed" and (.filename | scannable or in_requirements_dir))
              | { path: .filename,
                  base: (if .status == "added" or .status == "copied" then null
                         elif .status == "renamed" then .previous_filename
                         else .filename end),
                  # The scanner knows a file by its name: a base.txt inside a requirements
                  # folder it reads only when told what it is (measured on v2.7.0, 2026-11-12).
                  # No apostrophes in this program: it sits inside single quotes.
                  as: (if .filename | scannable then null else "requirements.txt" end) }
              | .safe = ((.path | safe) and (.base == null or (.base | safe))) ]'
          files=$(timeout 60 gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100") \
            || unread "could not list the files this PR changed"
          targets=$(jq -c "$OSV_FILES_JQ" <<< "$files") || unread "could not read the PR's file list"
          if jq -e 'any(.[]; .safe | not)' <<< "$targets" > /dev/null; then
            unread "a changed lockfile has a path this step will not write to disk"
          fi
          count=$(jq 'length' <<< "$targets")
          if [ "$count" -eq 0 ]; then
            out "verdict=nothing" "clear=true"
            echo "osv: this PR changes no lockfile OSV-Scanner reads (a GitHub Actions bump, say), so there is nothing to scan"
            exit 0
          fi
          echo "osv: $count lockfile(s) to scan: $(jq -r 'map(.path) | join(", ")' <<< "$targets")"

          # 2. Each one at the PR's head and at its merge base, as data, not a checkout.
          #    The base copy is written under the head's path so the two scans line up.
          merge_base=$(timeout 60 gh api "repos/$REPO/compare/$BASE_BRANCH...$HEAD_SHA" --jq '.merge_base_commit.sha') \
            || unread "could not find where this PR branched from $BASE_BRANCH"
          case "$merge_base" in ''|*[!0-9a-f]*) unread "the merge base came back unreadable" ;; esac
          fetch() {  # <path in repo> <commit> <file to write>
            local enc
            enc=$(jq -rn --arg p "$1" '$p | split("/") | map(@uri) | join("/")') || return 1
            mkdir -p "$(dirname "$3")" || return 1
            timeout 60 gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/$enc?ref=$2" > "$3"
          }
          head_args=(); base_args=()
          # Fields split on the unit separator (\x1f), not a tab: bash folds two tabs into
          # one, so an added file's empty base shifted its parser hint into the base slot.
          while IFS=$'\x1f' read -r path base as; do
            prefix=""; [ -z "$as" ] || prefix="$as:"
            fetch "$path" "$HEAD_SHA" "$work/head/$path" || unread "could not read $path at the PR's head"
            head_args+=(-L "$prefix$work/head/$path")
            if [ -n "$base" ]; then
              fetch "$base" "$merge_base" "$work/base/$path" || unread "could not read $base at the merge base"
              base_args+=(-L "$prefix$work/base/$path")
            fi
          done < <(jq -r '.[] | [.path, (.base // ""), (.as // "")] | map(gsub("[\u0000-\u001f]"; "?")) | join("\u001f")' <<< "$targets")

          # 3. The scanner, checked against its pin before it runs.
          timeout 120 curl -fsSL --retry 2 -o "$work/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64" \
            || unread "could not download OSV-Scanner $OSV_VERSION"
          echo "$OSV_SHA256  $work/bin/osv-scanner" | sha256sum -c --quiet - \
            || unread "the downloaded OSV-Scanner $OSV_VERSION does not match its pinned checksum"
          chmod +x "$work/bin/osv-scanner" || unread "could not make OSV-Scanner runnable"

          scan() {  # <side> [-L file]... → $work/<side>.json; 0 only if every file was read and OSV answered
            local side=$1 rc arg n
            shift
            if [ "$#" -eq 0 ]; then echo '{"results":[]}' > "$work/$side.json"; return 0; fi
            timeout 300 env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" \
              "$work/bin/osv-scanner" scan source --no-call-analysis=all --no-resolve \
              --format json --output-file "$work/$side.json" "$@" > "$work/$side.log" 2>&1
            rc=$?
            sed "s/^/  osv-scanner ($side): /" "$work/$side.log"
            # 0 = no advisories, 1 = some. 127 (a parse error, or OSV unreachable — it still
            # writes a JSON file then, so the file alone proves nothing), 128 (no packages)
            # and 124 (the timeout) are scans that did not happen.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then echo "  osv-scanner ($side): exit $rc"; return 1; fi
            jq -e '.results | type == "array"' "$work/$side.json" > /dev/null 2>&1 || return 1
            # Each file must have been read, with at least one package in it: a lockfile
            # that quietly yielded nothing would turn "could not read" into "clean".
            for arg in "$@"; do
              [ "$arg" = "-L" ] && continue
              arg=${arg#requirements.txt:}   # the log names the file, not how it was read
              n=$(grep -F "Scanned $arg file and found " "$work/$side.log" | tail -1 | sed 's/.* and found //; s/ .*//')
              case "$n" in ''|*[!0-9]*|0) echo "  osv-scanner ($side): read no packages from $arg"; return 1 ;; esac
            done
            return 0
          }
          # ${a[@]+"${a[@]}"}: an empty list (every lockfile newly added) expands to nothing
          # under `set -u` on any bash, including the 3.2 that check-osv.sh meets on a Mac.
          scan head ${head_args[@]+"${head_args[@]}"} || unread "OSV-Scanner could not scan this PR's lockfiles (its log is above)"
          scan base ${base_args[@]+"${base_args[@]}"} || unread "OSV-Scanner could not scan the same lockfiles at the merge base (its log is above)"

          # 4. Which advisories does the PR ADD? bin/lib/check-osv.sh pins this against
          #    fixtures. jq's IN compares the four-part arrays by value.
          # shellcheck disable=SC2016  # $o $p $b $h $bp $hp $before are jq variables
          OSV_NEW_JQ='
            def rows($o; $p):
              [ ($o.results // [])[]
                | ((.source.path // "") | ltrimstr($p)) as $file
                | (.packages // [])[]
                | (.package // {}) as $pkg
                | (.vulnerabilities // [])[]
                | { file: $file, ecosystem: ($pkg.ecosystem // ""), name: ($pkg.name // ""),
                    version: ($pkg.version // ""), id: (.id // "") } ];
            [ rows($b[0]; $bp)[] | [.file, .ecosystem, .name, .id] ] as $before
            | [ rows($h[0]; $hp)[]
                | select((.id | startswith("MAL-")) or (([.file, .ecosystem, .name, .id] | IN($before[])) | not)) ]
            | unique_by([.file, .ecosystem, .name, .version, .id])'
          new=$(jq -c -n --slurpfile b "$work/base.json" --slurpfile h "$work/head.json" \
                  --arg bp "$work/base/" --arg hp "$work/head/" "$OSV_NEW_JQ") \
            || unread "could not compare the two scans"
          n_new=$(jq 'length' <<< "$new") || unread "could not count the findings"
          if [ "$n_new" -eq 0 ]; then
            out "verdict=clean" "clear=true"
            n_old=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' "$work/head.json" 2>/dev/null || echo "?")
            echo "osv: clean. This PR adds no advisory OSV knows of (the lockfiles carry $n_old older one(s), which were there before it)."
            # Labels an earlier run left (a flag, or a scan that could not run) no longer
            # describe this head, which is about to be queued. If this run breaks after
            # here, the failure step puts dependabot-needs-human back.
            labels=$(timeout 60 gh pr view "$PR_URL" --json labels --jq '.labels[].name' 2>/dev/null)
            for stale in "$LABEL_OSV" "$LABEL_UNPARSED"; do
              if grep -qxF "$stale" <<< "$labels"; then
                timeout 60 gh pr edit "$PR_URL" --remove-label "$stale" > /dev/null \
                  && echo "removed '$stale': it described an earlier run"
              fi
            done
            exit 0
          fi
          out "verdict=flagged" "clear=false"
          {
            echo "findings<<OSV_FINDINGS_EOF"
            jq -r '.[] | [.id, .ecosystem, .name, .version, .file] | map(tostring | gsub("[\u0000-\u001f]"; "?")) | join("\u001f")' <<< "$new"
            echo "OSV_FINDINGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "osv: FLAGGED. This PR adds $n_new advisory(ies):"
          jq -r '.[] | "  \(.id)  \(.ecosystem) \(.name) \(.version)  (\(.file))"' <<< "$new"

      - name: Stop — OSV has an advisory for a version this update adds
        if: steps.osv.outputs.verdict == 'flagged'
        env:
          FINDINGS: ${{ steps.osv.outputs.findings }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label "$LABEL_OSV"
          # Step 1b already took off an earlier head's queue; this is the second look, in
          # case something queued one since. If this fails the run goes red, on purpose.
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "auto-merge turned off: an earlier head had queued it"
          fi
          marker="<!-- repo-standards:osv:$HEAD_SHA -->"
          if gh pr view "$PR_URL" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            echo "already explained on this head — not repeating it"
          else
            {
              echo "$marker"
              echo "**Not auto-merging this one.** [OSV](https://osv.dev) has an advisory for a version this update brings in:"
              echo ""
              while IFS=$'\x1f' read -r id eco name version file; do
                [ -n "$id" ] || continue
                # Text from a lockfile goes inside code spans; strip what could close one.
                eco=${eco//[^A-Za-z0-9 ._:-]/}; name=${name//\`/}; version=${version//\`/}; file=${file//\`/}
                case "$id" in
                  MAL-*) kind="**a malicious package**" ;;
                  *)     kind="a known vulnerability" ;;
                esac
                case "$id" in
                  *[!A-Za-z0-9._:-]*) ref="(an advisory id this workflow will not print)" ;;
                  *)                  ref="[$id](https://osv.dev/vulnerability/$id)" ;;
                esac
                echo "- \`$name\` \`$version\` ($eco, in \`$file\`): $kind, $ref"
              done <<< "$FINDINGS"
              echo ""
              echo "Only advisories this update *adds* stop it; ones the lockfile already carried before it do not (a \`MAL-\` report stops it either way). If a later version clears it, Dependabot's next push re-runs this check."
              echo ""
              echo "**To merge anyway:** read the advisory, then merge by hand. **To drop the update:** close this PR."
            } > "$RUNNER_TEMP/osv-comment.md"
            gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/osv-comment.md"
            echo "left the explanation comment"
          fi
          echo "stopped WITHOUT enabling auto-merge: OSV has an advisory for a version this PR adds"

      - name: Stop — the OSV check could not run
        if: steps.osv.outputs.verdict == 'unread'
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label "$LABEL_UNPARSED"
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "auto-merge turned off: an earlier head had queued it, and this head is unscanned"
          fi
          echo "stopped WITHOUT enabling auto-merge: the OSV scan could not run (the warning above says why). Re-running this workflow tries again."

      # ---------------------------------------------------------------------------------
      # 5. Approve and queue the merge.
      #
      # `--match-head-commit` is the safety catch: if anything pushes to the branch between
      # the classification above and this line, GitHub refuses rather than merging a commit
      # nobody classified.
      #
      # This now runs BEFORE the stale check below, and unconditionally once the gate is
      # clear. Enabling auto-merge on a PR whose check is red is harmless — GitHub simply
      # queues it and merges nothing until the check goes green. Doing it first is what
      # guarantees the PR is never left stranded by anything we do afterwards.
      # ---------------------------------------------------------------------------------
      - name: Approve and enable auto-merge
        # `clear` is written only by step 4b, and only when the scan ran clean, found no
        # lockfile, or is switched off — so a skipped or crashed scan never reaches here.
        if: steps.gate.outputs.ok == 'true' && steps.osv.outputs.clear == 'true'
        env:
          SUMMARY: ${{ steps.classify.outputs.summary }}
          REQUIRED_CHECKS: ${{ steps.gate.outputs.required-checks }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Approve only if this token has not already approved THIS head. A dismissed or
          # stale approval does not count. If the approve call itself fails, fail the run:
          # the usual cause is the repo switch "Allow GitHub Actions to create and approve
          # pull requests" being off (Settings → Actions → General), which enroll now sets —
          # and on 2026-09-14 a masked failure here left three list-maker PRs queued for
          # auto-merge with a review requirement that could never be met.
          # The event's head can be stale by the time we get here (a push during the run).
          # Never approve a head we did not classify: re-read the live head and stop if it moved;
          # the new push's own run will classify and approve that head.
          live_head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$live_head" != "$HEAD_SHA" ]; then
            echo "::warning title=Head moved::classified $HEAD_SHA but the PR now points at $live_head; leaving this head to its own run"
            exit 0
          fi
          # Count only this bot's APPROVED reviews on this exact head, across every page
          # (--paginate --slurp merges pages into one array-of-arrays; .[][] flattens it).
          # jq runs as a separate process on purpose: gh rejects --slurp together with
          # --jq ("not supported"), which took the first live run of this step down on
          # ynai #14 (2026-09-14). An unreadable review list counts as zero, which only
          # risks a duplicate approval, never a missing one.
          approved_here=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/reviews" | jq -r \
            "[.[][] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\" and .user.login == \"github-actions[bot]\" and .user.type == \"Bot\")] | length" || echo 0)
          if [ "${approved_here:-0}" -gt 0 ]; then
            echo "approval: already approved by github-actions[bot] on $HEAD_SHA"
          else
            # POST the review with commit_id pinned, so the approval is bound to the classified
            # head rather than to whatever the PR points at when the request lands.
            if ! gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA" --silent; then
              echo "::error title=Cannot approve::creating the review failed. If the error says GitHub Actions is not permitted to approve pull requests, turn on 'Allow GitHub Actions to create and approve pull requests' under Settings → Actions → General (bin/enroll sets it), then re-run this workflow."
              exit 1
            fi
            echo "approval: approved $HEAD_SHA"
          fi

          # Since March 2026 GitHub can answer 422 here when the merge requirements are not
          # yet satisfiable — usually because the checks have not been *reported* yet on a
          # brand-new head. One retry covers that race; a second failure is real and should
          # go red so the failure handler labels the PR.
          if ! gh pr merge --auto "--$IN_MERGE_METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"; then
            echo "first attempt to enable auto-merge failed; retrying once in 15s"
            sleep 15
            gh pr merge --auto "--$IN_MERGE_METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"
          fi
          echo "auto-merge ENABLED ($IN_MERGE_METHOD) for $HEAD_SHA"
          echo "it will land once these checks pass: [${REQUIRED_CHECKS:-unknown}]"
          echo "dependencies: ${SUMMARY:-none}"

      # ---------------------------------------------------------------------------------
      # 6. A PR that is behind base AND red: say so, and optionally nudge Dependabot.
      #
      # ⚠ WHY THERE IS NO LONGER AN "update-branch" OPTION HERE (removed 2026-09-11).
      # The old version called `gh pr update-branch`, which merges base into the PR branch
      # through the API **as github-actions[bot]**. GitHub's own rule: "events triggered by
      # the GITHUB_TOKEN … will not create a new workflow run" (workflow_dispatch and
      # repository_dispatch are the only exemptions). So that push fired NO `pull_request`
      # run — the required check stayed forever "expected, waiting", and on a repo whose
      # ruleset has `dismiss_stale_reviews_on_push` (eachie's does) the push also threw away
      # the bot's approval. The PR ended up unmergeable AND un-re-triggerable. The refresh
      # was solving a problem that does not exist anyway: every ruleset this system creates
      # sets `strict_required_status_checks_policy: false`, so being behind base does not
      # block the merge at all.
      #
      # What CAN fix a genuinely stale branch is a push from Dependabot itself, because that
      # is a real app and its pushes do trigger workflows. Hence `stale-strategy: comment`.
      # Default is `none`: auto-merge is already queued above, so a red check here is far
      # more often a real breakage — a human's problem, not a staleness problem.
      # ---------------------------------------------------------------------------------
      - name: Note (and optionally nudge) a PR that is stale and red
        if: steps.gate.outputs.ok == 'true' && steps.osv.outputs.clear == 'true'
        env:
          REQUIRED_CHECKS: ${{ steps.gate.outputs.required-checks }}
          REQUIRED_CHECKS_JSON: ${{ steps.gate.outputs.required-checks-json }}
        run: |
          set -euo pipefail
          # Everything in this step is advisory — auto-merge is already enabled above — so
          # it must never be the reason a run goes red. A non-numeric answer (an API blip,
          # a `null`) would make the `-eq` below fail under `set -e`, and the failure
          # handler would then label a PR that is, at that moment, queued to merge.
          behind=$(gh api "repos/$REPO/compare/$BASE_BRANCH...$HEAD_SHA" --jq '.behind_by' 2>/dev/null || echo 0)
          case "$behind" in ''|*[!0-9]*) behind=0 ;; esac
          echo "branch is $behind commit(s) behind $BASE_BRANCH"
          if [ "$behind" -eq 0 ]; then echo "up to date — nothing to do"; exit 0; fi

          # Only count failures among the checks the branch actually requires.
          #
          # Piped into a REAL jq rather than gh's `--jq`: gh's flag takes the expression and
          # nothing else, so `--jq --arg req …` would silently treat "--arg" as the program.
          # Any jq option (--arg, --argjson, --slurp) has to go to jq itself.
          # Names come in as a JSON array (see step 4: a check name can contain a comma).
          # The states are the union of step 7's two failure lists, so this warning and the
          # label never disagree about what "red" means; check-loops.sh pins that.
          # shellcheck disable=SC2016  # the $r and $req below are jq variables, not shell
          failed=$(gh pr view "$PR_URL" --json statusCheckRollup 2>/dev/null \
            | jq -r --argjson r "${REQUIRED_CHECKS_JSON:-[]}" '
              [ .statusCheckRollup[]?
                  | select((.name // .context // "") as $n | ($r | length == 0) or ($r | index([$n])))
                  | ((.conclusion // .state // "") | ascii_downcase)
                  | select(IN("failure", "timed_out", "action_required", "startup_failure", "error", "cancelled", "stale")) ]
              | length' 2>/dev/null || echo 0)
          case "$failed" in ''|*[!0-9]*) failed=0 ;; esac
          echo "$failed required check(s) currently failing"
          if [ "$failed" -eq 0 ]; then echo "nothing red — auto-merge stays queued as normal"; exit 0; fi

          echo "::warning title=Stale and red::This PR is $behind commit(s) behind $BASE_BRANCH with $failed required check(s) failing. Auto-merge is enabled and will wait; if the failure is staleness rather than the dependency, comment '@dependabot recreate' yourself."

          if [ "$IN_STALE_STRATEGY" = "comment" ]; then
            # One nudge per head commit — the marker stops a re-run from re-commenting.
            # UNVERIFIED as of 2026-09-11: whether Dependabot obeys a command posted by
            # github-actions[bot] rather than a real user. See the README decisions section.
            marker="<!-- repo-standards:recreate:$HEAD_SHA -->"
            if gh pr view "$PR_URL" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
              echo "already nudged for this head commit — not repeating it"
            else
              # Written to a file rather than a multi-line --body string: a literal newline
              # inside a YAML block scalar has to sit at exactly the block's indent, and the
              # next edit of this file is where that silently breaks.
              { echo "@dependabot recreate"; echo "$marker"; } > "$RUNNER_TEMP/recreate.md"
              gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/recreate.md"
              echo "asked Dependabot to recreate the branch (strategy: comment)"
            fi
          else
            echo "strategy 'none': leaving it queued. Auto-merge fires by itself the moment the check goes green."
          fi

      # ---------------------------------------------------------------------------------
      # 7. Watch the required checks, and label the PR if one FAILS. OFF BY DEFAULT.
      #
      # Runs only where a repo's stub sets `watch-minutes` above 0 (see that input for the
      # three steps that turn it on). Everywhere else this step is skipped and the run is
      # exactly what it was before 2026-09-22.
      #
      # Auto-merge is already queued (step 5), so a green result needs nothing from us and
      # a red one would otherwise sit queued forever with nobody told. This polls the PR's
      # checks every 20 seconds for up to `watch-minutes`, then:
      #   a required check failed    → label `label-ci-failed` (the verdict routines fire
      #                                on it and post to Slack); auto-merge stays queued, so
      #                                a fix or a Dependabot rebuild that goes green still
      #                                lands by itself
      #   every required check passed → remove that label if an earlier head left it
      #   still running at the limit, → a notice, and the label comes off too: it described
      #   or never reported              an earlier head. The weekly audit lists a queued
      #                                  update whose tests go red after the watch ended.
      # One gap, said plainly: a failed job RE-RUN to green (no new push) starts no run
      # here, so its label stays until the next push or until someone removes it.
      #   the head moved / PR closed  → stop; a new head gets its own run
      #   the checks are unreadable   → a warning naming the fix, and nothing else
      #
      # ADVISORY, LIKE STEP 6: nothing here may turn the run red, because the failure
      # handler below would then label a PR that is, right now, queued to merge. Hence
      # `set -uo pipefail` without `-e`, and every call checked by hand.
      #
      # "Required" means the contexts step 4 read from the branch rules — the same list
      # auto-merge itself waits on. A required check that has not reported yet is pending,
      # not passing. What counts as FAILED is pinned in WATCH_JQ below and checked against
      # bin/lib/loops-scan.py's copy by bin/lib/check-loops.sh: two copies of one rule.
      #
      # Why wait inside this run rather than start a new one when the check finishes: a
      # `check_run`/`check_suite` event is never delivered to a workflow for a check GitHub
      # Actions itself created (GitHub Docs, *Events that trigger workflows*, read
      # 2026-09-22), and every enrolled repo's gate but one is an Actions job; `workflow_run`
      # needs each repo's workflow names in its stub; `status` would start a run for every
      # commit status on every branch. All three also need a new stub in every repo. The
      # wait needs only two permission lines, and costs the check's own duration in runner
      # time (about two minutes on the measured repos).
      # ---------------------------------------------------------------------------------
      - name: Watch the required checks and label a failure
        if: steps.gate.outputs.ok == 'true' && steps.osv.outputs.clear == 'true' && inputs.watch-minutes > 0
        env:
          REQUIRED_CHECKS: ${{ steps.gate.outputs.required-checks }}
          REQUIRED_CHECKS_JSON: ${{ steps.gate.outputs.required-checks-json }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if [ -z "$REQUIRED_CHECKS" ] || [ "${REQUIRED_CHECKS_JSON:-[]}" = "[]" ]; then
            echo "no required checks to watch (require-ci is off here) — nothing to do"; exit 0
          fi
          # One verdict for the whole PR, from one verdict per required check:
          #   missing  — nothing by that name has reported at all (yet, or ever)
          #   failed   — a hard failure; or it was cancelled/stale and nothing of that
          #              name passed (a push+PR double trigger can cancel one run while
          #              its twin passes, and GitHub merges on the pass)
          #   pending  — something by that name is still running
          #   passed   — everything by that name finished, at least one passed
          # The three lists are pinned against bin/lib/loops-scan.py's HARD / SOFT / PASSED
          # by bin/lib/check-loops.sh: two copies of one rule.
          # shellcheck disable=SC2016  # $pr, $c, $v, $req, $head are jq variables
          WATCH_JQ='
            def hard: ["FAILURE", "TIMED_OUT", "ACTION_REQUIRED", "STARTUP_FAILURE", "ERROR"];
            def soft: ["CANCELLED", "STALE"];
            def pass: ["SUCCESS", "NEUTRAL", "SKIPPED"];
            def state_of:
              if length == 0 then "missing"
              elif any(IN(hard[])) then "failed"
              elif any((IN(pass[]) or IN(soft[])) | not) then "pending"
              elif any(IN(pass[])) then "passed"
              else "failed" end;
            if ((.errors // []) | length) > 0 or (.data.repository.pullRequest == null) then "unread"
            else .data.repository.pullRequest as $pr
            | if $pr.state != "OPEN" then "gone"
              elif $pr.headRefOid != $head then "moved"
              else
                [ ($pr.commits.nodes[0].commit.statusCheckRollup.contexts.nodes // [])[]
                  | {n: (.name // .context),
                     s: (if .__typename == "CheckRun"
                         then (if .status == "COMPLETED" then .conclusion else .status end)
                         else .state end)} ] as $c
                | [ $req[] as $x | {x: $x, v: ([ $c[] | select(.n == $x) | .s ] | state_of)} ] as $v
                | if any($v[]; .v == "failed") then "failed:" + ([ $v[] | select(.v == "failed") | .x ] | join(", "))
                  elif all($v[]; .v == "passed") then "passed"
                  elif any($v[]; .v == "pending") then "pending"
                  else "missing:" + ([ $v[] | select(.v == "missing") | .x ] | join(", ")) end
              end
            end'
          # shellcheck disable=SC2016  # $o, $r, $n are GraphQL variables
          QUERY='query($o: String!, $r: String!, $n: Int!) { repository(owner: $o, name: $r) { pullRequest(number: $n) {
            state headRefOid
            commits(last: 1) { nodes { commit { statusCheckRollup { contexts(first: 100) { nodes {
              __typename
              ... on CheckRun { name status conclusion }
              ... on StatusContext { context state }
            } } } } } } } } }'

          deadline=$(( $(date +%s) + IN_WATCH_MINUTES * 60 ))
          unread_in_a_row=0
          verdict=pending
          while :; do
            # `timeout`: one hung call must not eat the job's whole 25 minutes.
            resp=$(timeout 60 gh api graphql -f query="$QUERY" -f o="${REPO%%/*}" -f r="${REPO#*/}" -F n="$PR_NUMBER" 2>/dev/null)
            if [ -n "$resp" ]; then
              verdict=$(jq -r --argjson req "$REQUIRED_CHECKS_JSON" --arg head "$HEAD_SHA" "$WATCH_JQ" <<< "$resp" 2>/dev/null)
              [ -n "$verdict" ] || verdict=unread
            else
              verdict=unread
            fi
            # One unreadable answer is an API blip; three in a row is a token that cannot see.
            if [ "$verdict" = "unread" ]; then
              unread_in_a_row=$((unread_in_a_row + 1))
              if [ "$unread_in_a_row" -lt 3 ]; then verdict=pending; fi
            else
              unread_in_a_row=0
            fi
            case "$verdict" in pending|missing:*) ;; *) break ;; esac
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 20
          done
          # Blips at the very end leave `pending` standing in for "could not read".
          if [ "$verdict" = "pending" ] && [ "$unread_in_a_row" -gt 0 ]; then verdict=unread; fi

          # The label means "this head is red". Any other answer about a NEWER head than the
          # one that was labelled — passed, still running, never reported — means it no
          # longer describes the PR, so it comes off. (Unreadable leaves it: no new facts.)
          clear_label() {
            local labels
            labels=$(timeout 60 gh pr view "$PR_URL" --json labels --jq '.labels[].name' 2>/dev/null)
            # A here-string, not a pipe: `grep -q` exits at its first match, the writer then
            # takes SIGPIPE, and under pipefail a FOUND label reads as not found.
            if grep -qxF "$LABEL_CI_FAILED" <<< "$labels"; then
              timeout 60 gh pr edit "$PR_URL" --remove-label "$LABEL_CI_FAILED" \
                && echo "removed '$LABEL_CI_FAILED': it described an earlier head"
            fi
          }

          case "$verdict" in
            failed:*)
              failed=${verdict#failed:}
              if timeout 60 gh pr edit "$PR_URL" --add-label "$LABEL_CI_FAILED"; then
                echo "::warning title=Required check failed::[$failed] failed on $HEAD_SHA. Labelled '$LABEL_CI_FAILED'. Auto-merge stays queued and will land by itself if a fix goes green."
              else
                echo "::warning title=Could not label::[$failed] failed on $HEAD_SHA, and adding '$LABEL_CI_FAILED' was refused."
              fi
              ;;
            passed)
              echo "every required check passed on $HEAD_SHA — auto-merge will land it"
              clear_label
              ;;
            pending)
              echo "::notice title=Checks still running::[$REQUIRED_CHECKS] had not finished after ${IN_WATCH_MINUTES} minutes. Not labelled; the weekly audit lists a queued update whose tests go red later."
              clear_label
              ;;
            missing:*)
              echo "::warning title=Required check never reported::[${verdict#missing:}] never reported on $HEAD_SHA in ${IN_WATCH_MINUTES} minutes. If the workflow skips this kind of change (a paths filter) or the job was renamed, auto-merge will wait forever; the weekly audit lists it after a day."
              clear_label
              ;;
            moved) echo "the PR's head moved during the watch — its own run will watch the new head" ;;
            gone)  echo "the PR is no longer open (merged or closed) — nothing to watch" ;;
            *)
              echo "::warning title=Checks unreadable::Could not read this PR's check results. On a private repo that usually means this repo's automerge stub turns the watch on without granting 'checks: read' and 'statuses: read' in its permissions block."
              ;;
          esac
          exit 0

      # ---------------------------------------------------------------------------------
      # 8. If anything above broke, say so ON THE PULL REQUEST.
      #
      # A failed Actions run is invisible unless someone goes looking. A label is not.
      # ---------------------------------------------------------------------------------
      - name: Label the PR if this run itself broke
        if: failure()
        run: |
          gh label create "$LABEL_UNPARSED" --force --color b60205 \
            --description "Auto-merge could not classify this update (or the run broke)" --repo "$REPO" >/dev/null || true
          gh pr edit "$PR_URL" --add-label "$LABEL_UNPARSED" || true
          echo "::error title=dependabot-automerge failed::Labelled '$LABEL_UNPARSED'. See this run's log."
