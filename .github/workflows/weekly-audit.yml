# Weekly audit — the real `bin/audit --digest`, run where `gh` and a read token exist.
#
# WHY THIS IS HERE AND NOT IN THE ROUTINE: the "Dependabot weekly digest" routine runs in
# Anthropic's cloud, and that sandbox has no `gh` binary and no token that reaches other
# repos (verified on its first run, 2026-09-14 07:02 CT — `gh: command not found`). So the
# audit runs here, on GitHub's own runners, and leaves its output on the `audit-output`
# branch; the routine reads that file and writes the Slack message. Split this way, the
# part that needs credentials never touches an LLM, and the part that needs an LLM never
# touches credentials.
#
# THE ONE SECRET: `AUDIT_READ_TOKEN`, a fine-grained personal access token that can only
# READ (Actions, Administration, Contents, Metadata, Pull requests — on all of Kevin's
# repos). Read-only is the whole point: if it ever leaked it could look, never change.
# The standard's "no PAT" rule (2026-09-11) was about a token that could MERGE; this one
# cannot. Until the secret exists this job fails loudly at the preflight and the routine
# posts its fallback, which says so.
#
# COST: about 1,600 API calls a week against the token's own 5,000-an-hour budget, and
# about two minutes of Actions time on a public repo (free).
# Written 2026-09-14.

name: weekly-audit

on:
  schedule:
    # Monday 12:15 UTC — 07:15 in Austin during daylight time, 06:15 in winter. Either way
    # it is done well before the routine reads it at 08:00 America/Chicago.
    - cron: "15 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # to push the result to the audit-output branch

concurrency:
  group: weekly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.AUDIT_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The read token is present and can see the account
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=No read token::Add the AUDIT_READ_TOKEN secret (a read-only fine-grained PAT; see the comment at the top of this file). Until then the weekly digest is the fallback message."
            exit 1
          fi
          gh api user --jq '"authenticated as " + .login'

      - name: Run the audit
        run: |
          python3 -m pip install --quiet pyyaml
          mkdir -p out
          bin/audit --digest | tee out/latest-digest.md
          test -s out/latest-digest.md

      - name: Publish the result to the audit-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch that holds only the output: nothing on main changes, the
          # ruleset on main never sees a bot push, and the history is a week per commit.
          if git fetch --depth 1 origin audit-output 2>/dev/null; then
            git checkout -B audit-output FETCH_HEAD
          else
            git checkout --orphan audit-output
            git rm -rfq . || true
          fi
          cp out/latest-digest.md latest-digest.md
          git add latest-digest.md
          if git diff --cached --quiet; then echo "no change since last week"; exit 0; fi
          git commit -q -m "audit: weekly snapshot $(date -u +%Y-%m-%d)"
          git push origin audit-output
