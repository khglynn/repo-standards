# This repo's own copy of the caller stub. It lives under a DIFFERENT NAME than in every
# other repo, because .github/workflows/dependabot-automerge.yml here is the shared
# definition itself — the standards repo eats its own cooking without overwriting it.
#
#
# Why `pull_request_target` and not `pull_request`: Dependabot's PRs run with a read-only
# token and no access to secrets, so a `pull_request` workflow could not approve or merge
# anything. `pull_request_target` runs in the BASE repo's context with write permission.
# That is only safe because the called workflow never checks out the pull request's code —
# do not add a checkout step to either file.

name: dependabot-automerge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write        # enable auto-merge
  pull-requests: write   # approve, label, comment
  issues: write          # create the labels (labels are an Issues-API object)
  checks: read           # read the tests' results, to label an update whose tests failed
  statuses: read         # …and the commit statuses some gates report as (Vercel)
  # The shared workflow runs with exactly what this block grants — it declares none of its
  # own, because a called workflow that asks for a scope its caller withheld fails to start.
  # The two `read` lines were added 2026-09-22; a stub without them still works, it just
  # cannot see a failed test to label it (the weekly audit still lists those).

jobs:
  automerge:
    uses: khglynn/repo-standards/.github/workflows/dependabot-automerge.yml@main
    # ------------------------------------------------------------------------------
    # THE ONE CARVED EXCEPTION IN THIS REPO, and it is deliberate (2026-09-11).
    #
    # Nothing auto-merges here. Every dependency this repo has is a GitHub Action, and
    # those actions run with `contents: write` + `pull-requests: write` inside EVERY
    # enrolled repo, including the private ones. The only required check here is
    # `checks` — actionlint plus a template parse — which can tell you a workflow is
    # well-formed and cannot tell you an action's new code is safe. Auto-merging a
    # patch bump of `dependabot/fetch-metadata` would silently defeat the SHA-pinning
    # this repo's own README argues for: pinning to a SHA stops a TAG being re-pointed,
    # but a bot that merges the SHA change itself has put us back where we started.
    #
    # So both tiers wait for a person. The 7-day cooldown in .github/dependabot.yml is
    # a soak, not a review; this is the review. Each bump here is a handful a month.
    # ------------------------------------------------------------------------------
    with:
      merge-patch: false   # action bumps here run privileged in every enrolled repo — a human reads each one (2026-09-11)
      merge-minor: false   # same reason
    # Other exception points, for reference — uncomment in a NORMAL repo's stub, not here:
    #   merge-method: merge            # squash (default) | merge | rebase
    #   require-ci: true               # never auto-merge on a branch with no required check. Leave true.
    #   stale-strategy: comment        # none (default) | comment — what to do with a stale, red PR
    #   label-major: major-review-needed
    #   label-unparsed: dependabot-needs-human
    #   label-no-ci: no-ci-gate
    #   label-opted-out: dependabot-opted-out
